<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brain Terrain</title>
    <script>
      // Apply the saved theme and mode before the app paints (see src/theme.ts).
      try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('sb.theme')) || 'terrain' } catch { document.documentElement.dataset.theme = 'terrain' }
      try {
        const mode = JSON.parse(localStorage.getItem('sb.mode')) || 'light'
        document.documentElement.dataset.mode = mode === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode === 'dark' ? 'dark' : 'light'
      } catch { document.documentElement.dataset.mode = 'light' }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
